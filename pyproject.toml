[project]
name = "exchange"
version = "0.1.0"
description = "Currency exchange microservice for the Microsserv52 platform."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Educational"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "redis>=6.4,<7",
  "pyjwt>=2.10,<3",
  "pycountry>=24.6.1,<25",
  "prometheus-client>=0.20,<1",
  "python-json-logger>=3.3,<4",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "fakeredis>=2.30,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "respx>=0.22,<1",
  "ruff>=0.14,<1",
  "testcontainers>=4.13,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exchange"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires Docker or a local external dependency",
]

[tool.coverage.run]
branch = true
source = ["exchange"]
omit = ["src/exchange/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["exchange", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pycountry", "pycountry.*"]
ignore_missing_imports = true
