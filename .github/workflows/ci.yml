name: Exchange CI/CD

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/microsserv52/exchange

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
      - name: Check whitespace and merge markers
        run: |
          git diff --check
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude-dir=.venv --exclude-dir=target .

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Unit, API, contract and integration tests
        env:
          JWT_SECRET: ci-secret-with-at-least-32-characters-long
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  compose:
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate Compose definition
        run: docker compose config --quiet
      - name: Build, start and smoke test the standalone stack
        run: ./scripts/bootstrap.sh
      - name: Verify the runtime image is non-root
        run: test "$(docker compose exec -T exchange id -u)" = "10001"
      - name: Show container state
        if: always()
        run: docker compose ps
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the exact local Dockerfile
        run: docker build --tag "${IMAGE}:ci" .
      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [test, security, compose, container]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  verify-image:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published digest
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          docker pull "$PUBLISHED_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$PUBLISHED_IMAGE"
      - name: Start the standalone dependencies
        run: docker compose up --detach --build redis provider
      - name: Start the published image without rebuilding Exchange
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: EXCHANGE_IMAGE="$PUBLISHED_IMAGE" docker compose up --detach --no-build exchange
      - name: Smoke test the published image
        run: ./scripts/smoke.sh
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans